name: Build and Deploy on Ubuntu

# 1. Этот ключевой момент позволяет запускать workflow вручную
on:
  workflow_dispatch:
    # (Опционально) Можно добавить параметры для ввода с телефона
    # inputs:
    #   environment:
    #     description: 'Build environment'
    #     default: 'production'

jobs:
  build:
    # 2. Указываем использовать ваш self-hosted runner
    runs-on: self-hosted

    steps:
      # 3. Клонируем ваш репозиторий на сервер
      - name: Checkout code
        uses: actions/checkout@v4

      # 4. Настраиваем Node.js (если нужен)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Укажите вашу версию

      # 5. Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci

      # 6. ВАШ ГЛАВНЫЙ ШАГ: выполняем скрипт на сервере
      - name: Run production build
        run: node build-production.js
