name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Run checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run linter
        id: lint
        continue-on-error: true
        run: |
          OUTPUT=$(npm run lint 2>&1) || true
          echo "$OUTPUT"
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Run tests
        id: test
        continue-on-error: true
        run: |
          OUTPUT=$(npm test 2>&1) || true
          echo "$OUTPUT"
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Security audit
        id: audit
        continue-on-error: true
        run: |
          OUTPUT=$(npm audit --audit-level=high 2>&1) || true
          echo "$OUTPUT"
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      # ============================================================
      # ОТПРАВКА ДЕТАЛЬНОГО ОТЧЁТА В TELEGRAM
      # ============================================================
      - name: Send detailed Telegram notification
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_LINT: ${{ steps.lint.outcome }}
          STATUS_TEST: ${{ steps.test.outcome }}
          STATUS_AUDIT: ${{ steps.audit.outcome }}
          OUTPUT_LINT: ${{ steps.lint.outputs.output }}
          OUTPUT_TEST: ${{ steps.test.outputs.output }}
          OUTPUT_AUDIT: ${{ steps.audit.outputs.output }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Определяем общий статус
          if [[ "$STATUS_LINT" == "success" && "$STATUS_TEST" == "success" && "$STATUS_AUDIT" == "success" ]]; then
            STATUS="✅ PASSED"
            EMOJI="✅"
          else
            STATUS="❌ FAILED"
            EMOJI="❌"
          fi

          # Функция для извлечения последних строк ошибок
          get_last_lines() {
            echo "$1" | grep -E "error|failed|Error|Failed|ERR" | tail -5 || echo "No errors found"
          }

          LINT_ERRORS=$(get_last_lines "$OUTPUT_LINT")
          TEST_ERRORS=$(get_last_lines "$OUTPUT_TEST")
          AUDIT_ERRORS=$(get_last_lines "$OUTPUT_AUDIT")

          # Формируем сообщение с деталями
          MESSAGE="${EMOJI} *MIP CI Report*

          📦 *Repo:* ${{ github.repository }}
          🌿 *Branch:* ${{ github.ref_name }}
          💬 *Commit:* ${COMMIT_MSG:0:60}...
          👤 *Author:* ${{ github.actor }}

          ──────────────
          📊 *Status:* $STATUS

          📋 *Checks:*
          Linter:   $([[ "$STATUS_LINT" == "success" ]] && echo "✅" || echo "❌")
          Tests:    $([[ "$STATUS_TEST" == "success" ]] && echo "✅" || echo "❌")
          Security: $([[ "$STATUS_AUDIT" == "success" ]] && echo "✅" || echo "❌")

          ──────────────
          🔍 *Error Details:*"

          if [[ "$STATUS_LINT" != "success" ]]; then
            MESSAGE="${MESSAGE}
          
          *Linter Errors:*
          \`\`\`
          ${LINT_ERRORS}
          \`\`\`"
          fi

          if [[ "$STATUS_TEST" != "success" ]]; then
            MESSAGE="${MESSAGE}
          
          *Test Failures:*
          \`\`\`
          ${TEST_ERRORS}
          \`\`\`"
          fi

          if [[ "$STATUS_AUDIT" != "success" ]]; then
            MESSAGE="${MESSAGE}
          
          *Security Vulnerabilities:*
          \`\`\`
          ${AUDIT_ERRORS}
          \`\`\`"
          fi

          MESSAGE="${MESSAGE}
          ──────────────
          🔗 *Actions:* ${RUN_URL}"

          # Отправляем в Telegram
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
