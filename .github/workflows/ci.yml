name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: Проверка кода
    runs-on: ubuntu-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Установка зависимостей
        run: npm ci || npm install
      
      # ============================================================
      # 1. ЛИНТЕР — если ошибка → СТОП
      # ============================================================
      - name: 🔍 Линтер (ESLint)
        id: lint
        continue-on-error: false  # ❌ Ошибка = остановка
        run: |
          echo "::group::📋 Запуск линтера"
          START=$(date +%s%N)
          npm run lint
          END=$(date +%s%N)
          DURATION=$(( ($END - $START) / 1000000 ))
          echo "duration=${DURATION}ms" >> $GITHUB_OUTPUT
          echo "::endgroup::"
      
      
      
      # ============================================================
      # 3. АУДИТ — если ошибка → СТОП
      # ============================================================
      - name: 🔒 Аудит безопасности
        id: audit
        continue-on-error: false  # ❌ Ошибка = остановка
        run: |
          echo "::group::🔒 Аудит безопасности"
          START=$(date +%s%N)
          npm audit --audit-level=high
          END=$(date +%s%N)
          DURATION=$(( ($END - $START) / 1000000 ))
          echo "duration=${DURATION}ms" >> $GITHUB_OUTPUT
          echo "::endgroup::"
      
      # ============================================================
      # 4. ЕСЛИ ДОШЛИ СЮДА → ВСЁ ОК
      # ============================================================
      - name: ✅ Всё прошло
        if: success()
        run: echo "🎉 Все проверки пройдены! Можешь мержить."

      # ============================================================
      # 5. ЕСЛИ ОШИБКА → ОТПРАВЛЯЕМ В TELEGRAM И ВЫХОДИМ
      # ============================================================
      - name: 📱 ОШИБКА — уведомление в Telegram
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER: ${{ github.server_url }}
          SHA: ${{ github.sha }}
          FAILED_STEP: ${{ github.job }}
        run: |
          # -------- Определяем, что упало --------
          if [[ "${{ steps.lint.outcome }}" == "failure" ]]; then
            STEP="🔍 Линтер (ESLint)"
            FIX="Проверь синтаксис, неиспользуемые переменные, отступы"
            EXAMPLE="mip run lint --fix"
          elif [[ "${{ steps.test.outcome }}" == "failure" ]]; then
            STEP="🧪 Тесты"
            FIX="Запусти тесты локально: npm test"
            EXAMPLE="npm test -- --verbose"
          elif [[ "${{ steps.audit.outcome }}" == "failure" ]]; then
            STEP="🔒 Аудит безопасности"
            FIX="Обнови уязвимые пакеты: npm audit fix"
            EXAMPLE="npm audit fix"
          else
            STEP="❌ Неизвестная ошибка"
            FIX="Смотри логи"
            EXAMPLE=""
          fi
          
          # -------- Собираем сообщение --------
          MSG="❌ *MIP CI — ОШИБКА*

          📦 *Репозиторий:* ${REPO}
          🌿 *Ветка:* ${BRANCH}
          👤 *Автор:* ${AUTHOR}
          📝 *Коммит:* ${COMMIT:0:60}...

          ──────────────
          🚨 *Упало на:* ${STEP}

          💡 *Что делать:*
          ${FIX}

          🔧 *Команда для фикса:*
          \`${EXAMPLE}\`

          ──────────────
          🔗 *Логи:* ${SERVER}/${REPO}/actions/runs/${RUN_ID}"
          
          # -------- Отправка с кнопками --------
          if [[ -n "$TOKEN" && -n "$CHAT_ID" ]]; then
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$(cat <<EOF
          {
            "chat_id": "${CHAT_ID}",
            "text": "${MSG}",
            "parse_mode": "Markdown",
            "disable_web_page_preview": true,
            "reply_markup": {
              "inline_keyboard": [
                [
                  {"text": "📋 Логи", "url": "${SERVER}/${REPO}/actions/runs/${RUN_ID}"},
                  {"text": "📝 Коммит", "url": "${SERVER}/${REPO}/commit/${SHA}"}
                ]
              ]
            }
          }
          EOF
          )"
          fi
          
          # -------- Выходим с ошибкой --------
          exit 1
