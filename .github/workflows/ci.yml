name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    name: Run checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run linter
        id: lint
        continue-on-error: true
        run: npm run lint
      
      - name: Run tests
        id: test
        continue-on-error: true
        run: npm test
      
      - name: Security audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high
      
      - name: All checks passed ✅
        if: steps.lint.outcome == 'success' && steps.test.outcome == 'success' && steps.audit.outcome == 'success'
        run: echo "🎉 Все проверки пройдены успешно!"
      
      # ============================================================
      # ОТПРАВКА В TELEGRAM (добавлено)
      # ============================================================
      - name: Send Telegram notification
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS_LINT: ${{ steps.lint.outcome }}
          STATUS_TEST: ${{ steps.test.outcome }}
          STATUS_AUDIT: ${{ steps.audit.outcome }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Определяем общий статус
          if [[ "$STATUS_LINT" == "success" && "$STATUS_TEST" == "success" && "$STATUS_AUDIT" == "success" ]]; then
            STATUS="✅ PASSED"
            EMOJI="✅"
          else
            STATUS="❌ FAILED"
            EMOJI="❌"
          fi

          # Формируем сообщение
          MESSAGE="${EMOJI} *MIP CI Report*

          📦 *Repo:* ${{ github.repository }}
          🌿 *Branch:* ${{ github.ref_name }}
          💬 *Commit:* ${COMMIT_MSG:0:60}...
          👤 *Author:* ${{ github.actor }}

          ──────────────
          📊 *Status:* $STATUS

          📋 *Checks:*
          Linter:   $([[ "$STATUS_LINT" == "success" ]] && echo "✅" || echo "❌")
          Tests:    $([[ "$STATUS_TEST" == "success" ]] && echo "✅" || echo "❌")
          Security: $([[ "$STATUS_AUDIT" == "success" ]] && echo "✅" || echo "❌")

          ──────────────
          🔗 *Actions:* ${RUN_URL}"

          # Отправляем в Telegram
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="Markdown"
