name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: Проверка кода
    runs-on: ubuntu-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Установка зависимостей
        run: npm ci || npm install
      
      # ============================================================
      # 1. ЛИНТЕР
      # ============================================================
      - name: Линтер (ESLint)
        id: lint
        continue-on-error: true
        run: |
          echo "::group::📋 Запуск линтера"
          START=$(date +%s%N)
          OUTPUT=$(npm run lint 2>&1) || true
          END=$(date +%s%N)
          DURATION=$(( ($END - $START) / 1000000 ))
          echo "$OUTPUT"
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "duration=${DURATION}ms" >> $GITHUB_OUTPUT
          echo "::endgroup::"
      
      # ============================================================
      # 2. ТЕСТЫ
      # ============================================================
      - name: Тесты
        id: test
        continue-on-error: true
        run: |
          echo "::group::🧪 Запуск тестов"
          START=$(date +%s%N)
          OUTPUT=$(npm test 2>&1) || true
          END=$(date +%s%N)
          DURATION=$(( ($END - $START) / 1000000 ))
          echo "$OUTPUT"
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "duration=${DURATION}ms" >> $GITHUB_OUTPUT
          echo "::endgroup::"
      
      # ============================================================
      # 3. АУДИТ БЕЗОПАСНОСТИ
      # ============================================================
      - name: Аудит безопасности
        id: audit
        continue-on-error: true
        run: |
          echo "::group::🔒 Аудит безопасности"
          START=$(date +%s%N)
          OUTPUT=$(npm audit --audit-level=high 2>&1) || true
          END=$(date +%s%N)
          DURATION=$(( ($END - $START) / 1000000 ))
          echo "$OUTPUT"
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "duration=${DURATION}ms" >> $GITHUB_OUTPUT
          echo "::endgroup::"
      
      # ============================================================
      # 4. ОТПРАВКА В TELEGRAM С КНОПКАМИ
      # ============================================================
      - name: 📱 Уведомление в Telegram
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINT_STATUS: ${{ steps.lint.outcome }}
          TEST_STATUS: ${{ steps.test.outcome }}
          AUDIT_STATUS: ${{ steps.audit.outcome }}
          LINT_OUT: ${{ steps.lint.outputs.output }}
          TEST_OUT: ${{ steps.test.outputs.output }}
          AUDIT_OUT: ${{ steps.audit.outputs.output }}
          LINT_TIME: ${{ steps.lint.outputs.duration }}
          TEST_TIME: ${{ steps.test.outputs.duration }}
          AUDIT_TIME: ${{ steps.audit.outputs.duration }}
          COMMIT: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          SERVER: ${{ github.server_url }}
          SHA: ${{ github.sha }}
        run: |
          # -------- Вспомогательные функции --------
          get_errors() {
            echo "$1" | grep -iE "error|failed|fail|ERR|❌|not ok|✖|×" | tail -5 || echo "✅ Ошибок не найдено"
          }
          
          count_errors() {
            echo "$1" | grep -iEc "error|failed|fail|ERR|❌|not ok|✖|×" || echo "0"
          }
          
          trim() {
            echo "$1" | cut -c1-800
          }
          
          # -------- Определяем статус --------
          if [[ "$LINT_STATUS" == "success" && "$TEST_STATUS" == "success" && "$AUDIT_STATUS" == "success" ]]; then
            STATUS="✅ ПРОЙДЕНО"
            ICON="✅"
          else
            STATUS="❌ ПРОВАЛЕНО"
            ICON="❌"
          fi
          
          # -------- Собираем ошибки --------
          LINT_ERR=$(get_errors "$LINT_OUT")
          TEST_ERR=$(get_errors "$TEST_OUT")
          AUDIT_ERR=$(get_errors "$AUDIT_OUT")
          
          LINT_COUNT=$(count_errors "$LINT_OUT")
          TEST_COUNT=$(count_errors "$TEST_OUT")
          AUDIT_COUNT=$(count_errors "$AUDIT_OUT")
          
          # -------- Формируем сообщение --------
          MSG="${ICON} *MIP CI*

          📦 *Репозиторий:* ${REPO}
          🌿 *Ветка:* ${BRANCH}
          👤 *Автор:* ${AUTHOR}
          📝 *Коммит:* ${COMMIT:0:50}..."

          # -------- Время выполнения --------
          TOTAL_TIME=$(( ${LINT_TIME:-0} + ${TEST_TIME:-0} + ${AUDIT_TIME:-0} ))
          TOTAL_SEC=$(( TOTAL_TIME / 1000 ))
          MSG="${MSG}
          ⏱️ *Время:* ${TOTAL_SEC}с (линтер: ${LINT_TIME:-0}мс, тесты: ${TEST_TIME:-0}мс, аудит: ${AUDIT_TIME:-0}мс)"

          # -------- Результаты --------
          if [[ "$STATUS" == "❌ ПРОВАЛЕНО" ]]; then
            MSG="${MSG}
          
          ──────────────
          🚨 *ПРОВАЛЕНО!*

          📋 *Результаты:*
          🔍 Линтер:   $([[ "$LINT_STATUS" == "success" ]] && echo "✅" || echo "❌") (${LINT_COUNT} ошибок)
          🧪 Тесты:    $([[ "$TEST_STATUS" == "success" ]] && echo "✅" || echo "❌") (${TEST_COUNT} ошибок)
          🔒 Аудит:    $([[ "$AUDIT_STATUS" == "success" ]] && echo "✅" || echo "❌") (${AUDIT_COUNT} ошибок)"
            
            if [[ "$LINT_STATUS" != "success" ]]; then
              MSG="${MSG}
          
          *🔍 Линтер:*
          \`\`\`
          $(trim "$LINT_ERR")
          \`\`\`"
            fi
            
            if [[ "$TEST_STATUS" != "success" ]]; then
              MSG="${MSG}
          
          *🧪 Тесты:*
          \`\`\`
          $(trim "$TEST_ERR")
          \`\`\`"
            fi
            
            if [[ "$AUDIT_STATUS" != "success" ]]; then
              MSG="${MSG}
          
          *🔒 Аудит:*
          \`\`\`
          $(trim "$AUDIT_ERR")
          \`\`\`"
            fi
          else
            MSG="${MSG}
          
          ──────────────
          🎉 *ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ!*

          📋 *Результаты:*
          🔍 Линтер:   ✅ (${LINT_COUNT} ошибок)
          🧪 Тесты:    ✅ (${TEST_COUNT} ошибок)
          🔒 Аудит:    ✅ (${AUDIT_COUNT} ошибок)"
          fi
          
          # -------- Формируем JSON с кнопками --------
          # Экранируем специальные символы для JSON
          MSG_JSON=$(echo "$MSG" | jq -Rs .)
          
          # Создаём JSON с inline-кнопками
          PAYLOAD=$(cat <<EOF
          {
            "chat_id": "${CHAT_ID}",
            "text": ${MSG_JSON},
            "parse_mode": "Markdown",
            "disable_web_page_preview": true,
            "reply_markup": {
              "inline_keyboard": [
                [
                  {"text": "📋 Логи", "url": "${SERVER}/${REPO}/actions/runs/${RUN_ID}"},
                  {"text": "📝 Коммит", "url": "${SERVER}/${REPO}/commit/${SHA}"}
                ],
                [
                  {"text": "📦 Репозиторий", "url": "${SERVER}/${REPO}"},
                  {"text": "📚 Документация", "url": "https://mipdocs.fwh.is"}
                ]
              ]
            }
          }
          EOF
          )
          
          # -------- Отправка --------
          if [[ -n "$TOKEN" && -n "$CHAT_ID" ]]; then
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}"
          else
            echo "⚠️ Telegram не настроен (нет TOKEN или CHAT_ID)"
          fi
      
      # ============================================================
      # 5. ВЫВОД ИТОГОВОГО СТАТУСА
      # ============================================================
      - name: Итоговый статус
        if: always()
        run: |
          echo "=========================================="
          echo "  ИТОГОВЫЙ СТАТУС"
          echo "=========================================="
          echo ""
          echo "  🔍 Линтер:   ${{ steps.lint.outcome }} (${{ steps.lint.outputs.duration }})"
          echo "  🧪 Тесты:    ${{ steps.test.outcome }} (${{ steps.test.outputs.duration }})"
          echo "  🔒 Аудит:    ${{ steps.audit.outcome }} (${{ steps.audit.outputs.duration }})"
          echo ""
          
          if [[ "${{ steps.lint.outcome }}" == "success" && \
                "${{ steps.test.outcome }}" == "success" && \
                "${{ steps.audit.outcome }}" == "success" ]]; then
            echo "  🎉 ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ!"
            exit 0
          else
            echo "  ❌ ЕСТЬ ПРОБЛЕМЫ! Исправляй и пуши снова."
            exit 1
          fi
