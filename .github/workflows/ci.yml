name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: Run checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci || npm install
      
      - name: Run linter
        id: lint
        continue-on-error: true
        run: npm run lint
      
      - name: Run tests
        id: test
        continue-on-error: true
        run: npm test
      
      - name: Security audit
        id: audit
        continue-on-error: true
        run: npm audit --audit-level=high || true
      
      - name: All checks passed ✅
        if: steps.lint.outcome == 'success' && steps.test.outcome == 'success' && steps.audit.outcome == 'success'
        run: echo "🎉 Все проверки пройдены успешно!"
      
      # ============================================================
      # TELEGRAM УВЕДОМЛЕНИЕ (только статус + кнопки)
      # ============================================================
      - name: 📱 Telegram notification
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ steps.lint.outcome }}" == "success" && "${{ steps.test.outcome }}" == "success" && "${{ steps.audit.outcome }}" == "success" ]]; then
            STATUS="✅ PASSED"
          else
            STATUS="❌ FAILED"
          fi
          
          MSG="${STATUS} *MIP CI*
          
          📦 ${{ github.repository }}
          🌿 ${{ github.ref_name }}
          👤 ${{ github.actor }}
          📝 ${COMMIT:0:50}...
          
          📋 Checks:
          Linter:   ${{ steps.lint.outcome }}
          Tests:    ${{ steps.test.outcome }}
          Audit:    ${{ steps.audit.outcome }}"
          
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MSG}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true" \
            -d reply_markup='{"inline_keyboard":[[{"text":"📋 Logs","url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"},{"text":"📝 Commit","url":"${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"}]],"resize_keyboard":true}'