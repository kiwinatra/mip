name: CI

# Запускать при пуше в main и develop
on:
  push:
    branches:
      - main
  # И при создании Pull Request'ов
  pull_request:
    branches:
      - main

jobs:
  check:
    name: Run checks
    runs-on: ubuntu-latest
    
    steps:
      # 1. Загружаем код
      - name: Checkout code
        uses: actions/checkout@v3
      
      # 2. Устанавливаем Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      
      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: npm ci
      
      # 4. Запускаем линтер
      - name: Run linter
        run: npm run lint
      
      # 5. Запускаем тесты
      - name: Run tests
        run: npm test
      
      # 6. Проверяем безопасность
      - name: Security audit
        run: npm audit --audit-level=high
      
      # 7. Если всё успешно — выводим сообщение
      - name: All checks passed ✅
        run: echo "🎉 Все проверки пройдены успешно!"
