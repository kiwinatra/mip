name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: Проверка кода
    runs-on: ubuntu-latest
    
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      
      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Установка зависимостей
        run: npm ci || npm install
      
      # ============================================================
      # 1. ЛИНТЕР
      # ============================================================
      - name: 🔍 Линтер
        id: lint
        continue-on-error: true
        run: npm run lint
      
      # ============================================================
      # 2. ТЕСТЫ
      # ============================================================
      - name: 🧪 Тесты
        id: test
        continue-on-error: true
        run: npm test
      
      # ============================================================
      # 3. АУДИТ
      # ============================================================
      - name: 🔒 Аудит
        id: audit
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high || true
      
      # ============================================================
      # 4. УСТАНОВКА ПАКЕТА
      # ============================================================
      - name: 📦 Установка пакета
        id: install
        continue-on-error: true
        run: |
          node bin/mip.js install lodash
          node -e "require('lodash')"
      
      # ============================================================
      # 5. ПЛАГИНЫ
      # ============================================================
      - name: 🔌 Плагины
        id: plugin
        continue-on-error: true
        run: |
          node bin/mip.js plugin create test
          node bin/mip.js plugin compile test
          node bin/mip.js plugin activate test
          node bin/mip.js pe test hello | grep Hello
      
      # ============================================================
      # 6. МИГРАЦИЯ
      # ============================================================
      - name: 📁 Миграция из npm
        id: migrate
        continue-on-error: true
        run: |
          echo '{"dependencies": {"chalk": "^5.0.0"}}' > package.json
          node bin/mip.js install
          test -f mip.yml
          node -e "require('chalk')"
      
      # ============================================================
      # 7. КЕШ
      # ============================================================
      - name: 🌍 Кеш
        id: cache
        continue-on-error: true
        run: |
          node bin/mip.js install express
          node bin/mip.js install express
          ls ~/.mip/store/express/
      
      # ============================================================
      # 8. YAML vs JSON
      # ============================================================
      - name: 📝 YAML/JSON
        id: yaml
        continue-on-error: true
        run: |
          node bin/mip.js init
          node bin/mip.js install lodash
          test -f mip.yml
          test -f mip-lock.yml
          echo '{"dependencies": {"axios": "^1.0.0"}}' > mip.json
          node bin/mip.js install
          test -f mip-lock.json
      
      # ============================================================
      # 9. TELEGRAM (КОРОТКО)
      # ============================================================
      - name: 📱 Telegram
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FAILED=0
          [[ "${{ steps.lint.outcome }}" == "failure" ]] && ((FAILED++))
          [[ "${{ steps.test.outcome }}" == "failure" ]] && ((FAILED++))
          [[ "${{ steps.audit.outcome }}" == "failure" ]] && ((FAILED++))
          [[ "${{ steps.install.outcome }}" == "failure" ]] && ((FAILED++))
          [[ "${{ steps.plugin.outcome }}" == "failure" ]] && ((FAILED++))
          [[ "${{ steps.migrate.outcome }}" == "failure" ]] && ((FAILED++))
          [[ "${{ steps.cache.outcome }}" == "failure" ]] && ((FAILED++))
          [[ "${{ steps.yaml.outcome }}" == "failure" ]] && ((FAILED++))
          
          if [[ $FAILED -eq 0 ]]; then
            MSG="✅ CI OK%0A📦 ${{ github.repository }}%0A🌿 ${{ github.ref_name }}%0A👤 ${{ github.actor }}%0A🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            MSG="❌ CI FAILED ($FAILED ошибок)%0A📦 ${{ github.repository }}%0A🌿 ${{ github.ref_name }}%0A👤 ${{ github.actor }}%0A🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MSG}" \
            -d parse_mode="Markdown" \
            -d disable_web_page_preview="true"